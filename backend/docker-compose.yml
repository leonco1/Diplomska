services:
  postgres:
    image: postgres:16
    container_name: streamapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streamapp
      POSTGRES_INITDB_ARGS: '-A md5'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: postgres -c password_encryption=md5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: streamapp-keycloak
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Legacy env names (still honored by 25.x) kept for compatibility.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    ports:
      - '8081:8080'
    volumes:
      # Auto-import the StreamApp realm on first start (dev mode, H2 storage).
      - ./keycloak:/opt/keycloak/data/import

volumes:
  pgdata:
